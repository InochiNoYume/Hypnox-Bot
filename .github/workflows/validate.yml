name: Validate
on:
  push:
  pull_request:
jobs:
  syntax:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install
      - name: Check JavaScript syntax
        shell: bash
        run: |
          set -e
          find src -type f -name '*.js' -print0 | while IFS= read -r -d '' file; do
            node --check "$file"
          done
